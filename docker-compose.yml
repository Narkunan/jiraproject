services:
  spring-app:
    image: gradle:8.14-jdk17
    container_name: spring-demo
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - gradle-cache:/home/gradle/.gradle
    command: gradle --no-daemon bootRun
    stdin_open: true
    tty: true
  mysql:
    image: 'mysql:8.4.7'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'

volumes:
  gradle-cache:
